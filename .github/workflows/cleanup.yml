# ==========================================================
# 定期清理：旧 workflow runs + logs + artifacts（纯 API 版，零第三方 action 依赖）
# 放到仓库的 .github/workflows/cleanup.yml 即可
#
# 为什么要有这个：
#   GitHub 官方文档对 "Delete a workflow run" 的描述只有一句 "Deletes a specific workflow run."，
#   并未承诺会连带删除该 run 的 artifacts / logs（logs 甚至有独立的 Delete endpoint）。
#   所以想把占用的存储配额真正释放出来，产物必须单独删。
#
# 需要权限：permissions.actions = write
# ==========================================================
name: Cleanup old runs and artifacts

on:
  schedule:
    - cron: '23 3 * * 0'   # 每周日凌晨 3:23 UTC
  workflow_dispatch:
    inputs:
      retain_days:
        description: '保留最近 N 天'
        default: '30'
      keep_minimum_runs:
        description: '每个 workflow 至少保留的 run 数'
        default: '20'
      keep_minimum_artifacts:
        description: '至少保留的 artifact 数'
        default: '10'
      delete_logs:
        description: '是否同时删除 run 日志'
        type: choice
        options: ['true', 'false']
        default: 'true'
      dry_run:
        description: '预演（不真删）'
        type: choice
        options: ['false', 'true']
        default: 'false'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: write
      contents: read

    steps:
      - name: Cleanup via GitHub REST API
        uses: actions/github-script@v7
        env:
          RETAIN_DAYS: ${{ github.event.inputs.retain_days || '30' }}
          KEEP_MIN_RUNS: ${{ github.event.inputs.keep_minimum_runs || '20' }}
          KEEP_MIN_ARTIFACTS: ${{ github.event.inputs.keep_minimum_artifacts || '10' }}
          DELETE_LOGS: ${{ github.event.inputs.delete_logs || 'true' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        with:
          script: |
            const sleep = (ms) => new Promise(r => setTimeout(r, ms));
            const { owner, repo } = context.repo;
            const retainDays   = Number(process.env.RETAIN_DAYS);
            const keepRuns     = Number(process.env.KEEP_MIN_RUNS);
            const keepArts     = Number(process.env.KEEP_MIN_ARTIFACTS);
            const doLogs       = process.env.DELETE_LOGS === 'true';
            const dry          = process.env.DRY_RUN === 'true';
            const cutoff       = Date.now() - retainDays * 86400000;

            const human = (b) => (b / 1024 / 1024).toFixed(1) + ' MB';

            // 带限流重试的调用
            async function safe(fn, label) {
              for (let attempt = 0; attempt < 6; attempt++) {
                try {
                  return await fn();
                } catch (e) {
                  const st = e.status || e.response?.status;
                  if ((st === 403 || st === 429) && attempt < 5) {
                    const wait = Math.min(90, 10 * (attempt + 1));
                    core.warning(`${label} 触发限流，等待 ${wait}s 后重试`);
                    await sleep(wait * 1000);
                    continue;
                  }
                  throw e;
                }
              }
            }

            // 小批量并发，避免二级限流
            async function runChunked(items, size, worker) {
              for (let i = 0; i < items.length; i += size) {
                await Promise.all(items.slice(i, i + size).map(worker));
                if (i + size < items.length) await sleep(300);
              }
            }

            // ---------------- 1. Artifacts ----------------
            core.info('=== 1/3 清理 artifacts ===');
            const arts = (await safe(
              () => github.paginate(github.rest.actions.listArtifactsForRepo,
                { owner, repo, per_page: 100 }),
              'listArtifacts'
            )).filter(a => !a.expired)
              .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));

            const artsTarget = arts.slice(keepArts)
              .filter(a => Date.parse(a.created_at) < cutoff);
            core.info(`artifact 总数 ${arts.length}，保留最新 ${keepArts} 个，命中删除 ${artsTarget.length} 个`);

            let freedBytes = 0, artOk = 0, artFail = 0;
            await runChunked(artsTarget, 5, async (a) => {
              freedBytes += a.size_in_bytes;
              if (dry) return;
              try {
                await safe(() => github.rest.actions.deleteArtifact(
                  { owner, repo, artifact_id: a.id }), `deleteArtifact ${a.id}`);
                artOk++;
              } catch (e) {
                artFail++;
                core.warning(`删除 artifact ${a.name}(#${a.id}) 失败: ${e.message}`);
              }
            });
            core.info(`artifact：成功 ${artOk}，失败 ${artFail}，释放约 ${human(freedBytes)}`);

            // ---------------- 2. Logs ----------------
            let logOk = 0;
            if (doLogs) {
              core.info('=== 2/3 清理 logs ===');
              // 留到第 3 步一并处理，见下
            }

            // ---------------- 3. Workflow runs ----------------
            core.info('=== 3/3 清理 workflow runs ===');
            const runs = (await safe(
              () => github.paginate(github.rest.actions.listWorkflowRunsForRepo,
                { owner, repo, per_page: 100, status: 'completed' }),
              'listWorkflowRuns'
            )).sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));

            // 按 workflow 分组，每个 workflow 至少保留 keepRuns 条
            const seen = new Map();
            const runsTarget = [];
            for (const r of runs) {
              if (Date.parse(r.created_at) >= cutoff) continue;
              const n = (seen.get(r.workflow_id) || 0) + 1;
              seen.set(r.workflow_id, n);
              if (n <= keepRuns) continue;
              runsTarget.push(r);
            }
            core.info(`run 总数 ${runs.length}，保留每个 workflow 最近 ${keepRuns} 条，命中删除 ${runsTarget.length} 条`);

            let runOk = 0, runFail = 0;
            await runChunked(runsTarget, 5, async (r) => {
              if (dry) return;
              try {
                if (doLogs) {
                  try {
                    await safe(() => github.rest.actions.deleteWorkflowRunLogs(
                      { owner, repo, run_id: r.id }), `deleteLogs ${r.id}`);
                    logOk++;
                  } catch (_) { /* 日志可能已被级联删除，忽略 */ }
                }
                await safe(() => github.rest.actions.deleteWorkflowRun(
                  { owner, repo, run_id: r.id }), `deleteRun ${r.id}`);
                runOk++;
              } catch (e) {
                runFail++;
                core.warning(`删除 run ${r.id}(${r.name}) 失败: ${e.message}`);
              }
            });

            core.summary.addRaw([
              '### GitHub Actions 清理结果' + (dry ? '（预演）' : ''),
              '',
              `保留窗口：最近 ${retainDays} 天｜每个 workflow 最少保留 ${keepRuns} 条 run｜最少保留 ${keepArts} 个 artifact`,
              '',
              '| 类别 | 命中 | 成功 | 失败 | 备注 |',
              '| --- | --- | --- | --- | --- |',
              `| artifacts | ${artsTarget.length} | ${artOk} | ${artFail} | 释放约 ${human(freedBytes)} |`,
              `| logs | - | ${logOk} | - | ${doLogs ? '' : '未启用' } |`,
              `| workflow runs | ${runsTarget.length} | ${runOk} | ${runFail} |`,
            ].join('\n')).write();

            core.info(`完成：artifacts ${artOk}/${artsTarget.length}，runs ${runOk}/${runsTarget.length}，logs ${logOk}`);
